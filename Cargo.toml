[workspace]
resolver = "3"
members = [
    "crates/emu_vfs",
    "crates/emu_storage",
    "crates/emu_audio",
    "crates/emu_input",
    "crates/emu_host",
    "crates/emu_ffi",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["OmniStation Core Team <dev@omnistation.emu>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
memmap2 = "0.9.5"
aes = "0.8.4"
cbc = "0.1.2"
sha1 = "0.10.6"
hmac = "0.12.1"
zstd = "0.13.3"
flate2 = "1.0.35"
rtrb = "0.3.1"
rubato = "0.16.2"
cpal = "0.15.3"
spin_sleep = "1.3.0"
thiserror = "2.0.12"
parking_lot = "0.12.3"
log = "0.4.26"
env_logger = "0.11.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
proptest = "1.6.0"
tempfile = "3.17.1"
